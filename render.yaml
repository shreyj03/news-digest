services:
  - type: web
    name: news-digest-api
    runtime: node
    plan: free
    # ingest/ needs its own node_modules too — /api/fetch shells out to it
    # (see DECISIONS.md on keeping the ingestion pipeline a separate piece).
    buildCommand: npm install --prefix api && npm run build --prefix api && npm install --prefix ingest
    startCommand: npm start --prefix api
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FETCH_SECRET
        sync: false
      # The account whose data anonymous visitors see as a read-only demo.
      - key: DEMO_USER_EMAIL
        sync: false
      # Optional together — welcome/digest email is a no-op until BOTH are
      # set. Brevo (not Resend — see DECISIONS.md): a single verified sender
      # email, no owned domain required, can send to any recipient on
      # Brevo's free tier, which multi-user actually needs.
      - key: BREVO_API_KEY
        sync: false
      # Must be exactly the email address verified as a sender in Brevo
      # (Senders, Domains & Dedicated IPs → Senders) — there's no safe
      # generic fallback the way Resend's shared onboarding@resend.dev was.
      - key: DIGEST_EMAIL_FROM
        sync: false
      # Optional — the link the digest email points back to. Defaults to
      # this project's own deployed frontend URL if unset; set this when
      # redeploying to your own accounts so the email links to your site.
      - key: SITE_URL
        sync: false
      # Optional — a free Google AI Studio key (aistudio.google.com/apikey).
      # When set, ingest.ts asks Gemini Flash to write a one-sentence
      # display summary for each newly-inserted article. Unset means no
      # AI summaries, everything else works the same (see DECISIONS.md).
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: news-digest-web
    runtime: static
    plan: free
    buildCommand: npm install --prefix web && npm run build --prefix web
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_BASE
        sync: false
