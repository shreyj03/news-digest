name: Daily fetch

on:
  schedule:
    # 14:13 UTC = 7:13 AM PDT (UTC-7, summer) or 6:13 AM PST (UTC-8, winter).
    # GitHub's cron is fixed UTC and doesn't shift for daylight saving on its
    # own, so this is pinned to the summer offset deliberately — that keeps
    # it at or before 7am Pacific year-round (never later), safely ahead of
    # the 8am target. A non-round minute avoids the top-of-hour queue where
    # GitHub's scheduler tends to be more delayed.
    - cron: "13 14 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest + match, and send the digest email
        # ?email=1 is what makes this the one caller that sends mail — the
        # "Fetch news" button hits the same endpoint without it, so clicking
        # that never spams the inbox. A no-op server-side until
        # RESEND_API_KEY/DIGEST_EMAIL_TO are actually set on the API service.
        run: |
          curl -sf -X POST "${{ secrets.API_URL }}/api/fetch?email=1" \
            -H "Authorization: Bearer ${{ secrets.FETCH_SECRET }}" \
            --max-time 120
